<div class="card border-primary">
    <div class="card-body">
        <h5 class="card-title">Pelanggan</h5>
        <!-- SEARCH -->
        <div>
            <form>
                <div class="row">
                    <div class="col-md-6 mb-6">
                        <label for="pelangganNameInput">Nama</label>
                        <input type="text" class="form-control" id="pelangganNameInput" [(ngModel)]='searchTerm.name'
                            name="searchName" placeholder="Enter Nama">
                    </div>
                </div>
                <br>
                <div class="btn-group" role="group">
                    <button type="button" (click)="onFilter()" class="btn mr-2 btn-outline-success btn-sm">Search <i
                        class="fa fa-search fa-lg"></i>
                    </button>
                    <button type="button" (click)="resetFilter()" class="btn btn-outline-danger btn-sm">Reset <i
                        class="fa fa-refresh fa-lg"></i>
                    </button>
                    <button type="button" class="btn ml-2 btn-outline-primary btn-sm" (click)="open('addnew', null)">Addnew
                        <i class="fa fa-plus-circle fa-lg"></i>
                    </button>
                </div>
            </form>
        </div>
        
        <div style="height:400px; padding: 15px 15px 15px 15px; overflow-y: auto;" *ngIf="pelanggans">
            <table class="table table-sm table-hover table-striped">
                <thead>
                    <tr>
                        <th></th>
                        <th></th>
                        <th scope="col">Tgl Masuk</th>
                        <th scope="col">Nama</th>
                        <th scope="col">Instansi</th>
                        <th scope="col">No STR</th>
                        <th scope="col">Profesi</th>
                        <th scope="col">No HP</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let pelanggan of pelanggans">
                        <td>
                            <button type="button" (click)="open('edit', pelanggan)" class="btn btn-outline-warning btn-sm">
                                <i class="fa fa-edit fa-lg"></i>
                            </button>
                        </td>
                        <td>
                            <button type="button" (click)="delete(pelanggan)" class="btn btn-outline-danger btn-sm">
                                <i class="fa fa-trash fa-lg"></i>
                            </button>
                        </td>
                        <td>{{ pelanggan.tglMasuk | date:'dd-MMM-yyyy' }}</td>
                        <td>{{ pelanggan.nama }}</td>
                        <td>{{ pelanggan.instansi }}</td>
                        <td>{{ pelanggan.noStr }}</td>
                        <td>{{ pelanggan.profesi }}</td>
                        <td>{{ pelanggan.noHp }}</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <ngb-pagination size="sm" [collectionSize]="totalData" [(page)]="curPage" [maxSize]="totalRecord"
            (pageChange)="loadPage()" [boundaryLinks]="true">
        </ngb-pagination>
    </div>
</div>
